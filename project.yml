# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed).
name: Cindy
options:
  bundleIdPrefix: com.celloai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Cindy:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cindy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: So you can talk to Cindy. Your request is sent only to your own PC.
        NSSpeechRecognitionUsageDescription: To notice "Hey Cindy", on your iPhone.
        NSCameraUsageDescription: To scan the pairing code your PC shows.
        NSLocalNetworkUsageDescription: To reach Cindy on your PC over your home network.
        # Keeps the microphone running for "Hey Cindy" while the app is in the background.
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # celloai://pair?... — scanning the PC's QR code with the Camera app opens Cindy to pair
        CFBundleURLTypes:
          - CFBundleURLName: com.celloai.pair
            CFBundleURLSchemes: [celloai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.celloai.cindy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Cindy:
    build:
      targets:
        Cindy: all
