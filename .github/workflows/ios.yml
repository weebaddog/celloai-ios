name: ios

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sideload:
    # Unsigned iPhone build to install with Sideloadly (or AltStore) and your Apple ID.
    # Sideloaded, Cindy can keep the mic on in the background for "Hey Cindy" (App Store rules wouldn't allow that).
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project Cindy.xcodeproj -scheme Cindy -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -80; tail -n 30 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cindy.app Payload/
          zip -qry Cindy-sideload.ipa Payload
          ls -l Cindy-sideload.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Cindy-sideload
          path: Cindy-sideload.ipa
          retention-days: 30
